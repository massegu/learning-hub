<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980"><rect x="0" y="0" width="1200" height="980" rx="0" fill="#f6f3ec" stroke="none"/><rect x="22" y="22" width="1156" height="936" rx="16" fill="#fff" stroke="none"/><path d="M55 50L1145 50" stroke="#243947" stroke-width="2" stroke-dasharray=""/><text x="60" y="110" data-right="1142" font-family="DejaVu Sans" font-size="33" font-weight="bold" fill="#243947">BOLETÍN DEL CENTRO · Ciudad de Panamá · 19/10/2026</text><path d="M55 189.5L1145 189.5" stroke="#243947" stroke-width="2" stroke-dasharray=""/><text x="65" y="265" data-right="1162" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#71838d">FUENTE A</text><text x="65" y="325" data-right="562" font-family="DejaVu Sans" font-size="29" font-weight="normal" fill="#243947">Fuente A · Consejo de</text><text x="65" y="368.5" data-right="562" font-family="DejaVu Sans" font-size="29" font-weight="normal" fill="#243947">estudiantes: respondieron 40</text><text x="65" y="412.0" data-right="562" font-family="DejaVu Sans" font-size="29" font-weight="normal" fill="#243947">personas y 30 pidieron más</text><text x="65" y="455.5" data-right="562" font-family="DejaVu Sans" font-size="29" font-weight="normal" fill="#243947">sombra.</text><text x="630" y="265" data-right="1162" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#71838d">FUENTE B</text><text x="630" y="325" data-right="1127" font-family="DejaVu Sans" font-size="29" font-weight="normal" fill="#243947">Fuente B · Registro del centro:</text><text x="630" y="368.5" data-right="1127" font-family="DejaVu Sans" font-size="29" font-weight="normal" fill="#243947">hay 160 estudiantes; se</text><text x="630" y="412.0" data-right="1127" font-family="DejaVu Sans" font-size="29" font-weight="normal" fill="#243947">instalaron dos toldos la semana</text><text x="630" y="455.5" data-right="1127" font-family="DejaVu Sans" font-size="29" font-weight="normal" fill="#243947">pasada.</text><path d="M600 245L600 650" stroke="#c8d3d6" stroke-width="2" stroke-dasharray=""/><rect x="60" y="700" width="1080" height="165" rx="10" fill="#f2eee4" stroke="none"/><text x="90" y="755" data-right="1112" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#243947">Ninguna fuente mide aún si los toldos cubren la zona solicitada.</text><text x="55" y="945" data-right="1162" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#687d85">Panamá</text></svg>