 fill="#243947">Alex Ruiz</text><path d="M65 675.5L1010 675.5" stroke="#c8d3d6" stroke-width="2" stroke-dasharray=""/><text x="65" y="775.5" data-right="1037" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#243947">Guardar borrador no envía la solicitud. Al enviarla se genera un</text><text x="65" y="813.0" data-right="1037" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#243947">comprobante.</text><text x="55" y="925" data-right="1062" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#687d85">España</text></svg>