<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000"><rect x="0" y="0" width="900" height="1000" rx="0" fill="#f6f3ec" stroke="none"/><rect x="22" y="22" width="856" height="956" rx="16" fill="#fff" stroke="none"/><rect x="22" y="22" width="856" height="956" rx="16" fill="#fffaf0" stroke="none"/><rect x="52" y="50" width="796" height="7" rx="0" fill="#725843" stroke="none"/><text x="75" y="125" data-right="862" font-family="DejaVu Sans" font-size="43" font-weight="bold" fill="#654b38">CAFÉ DEL PATIO</text><text x="75" y="175" data-right="862" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#243947">Rosario</text><text x="75" y="225" data-right="862" font-family="DejaVu Sans" font-size="23" font-weight="normal" fill="#243947">Precios en pesos argentinos (ARS)</text><path d="M75 260L825 260" stroke="#cdb795" stroke-width="2" stroke-dasharray="4 6"/><text x="75" y="340" data-right="862" font-family="DejaVu Sans" font-size="31" font-weight="normal" fill="#243947">Sándwich de queso</text><text x="640" y="340" data-right="862" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#243947">2.400 ARS</text><path d="M75 370L825 370" stroke="#d4c7ad" stroke-width="2" stroke-dasharray="2 7"/><text x="75" y="440" data-right="862" font-family="DejaVu Sans" font-size="31" font-weight="normal" fill="#243947">Ensalada</text><text x="640" y="440" data-right="862" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#243947">3.200 ARS</text><path d="M75 470L825 470" stroke="#d4c7ad" stroke-width="2" stroke-dasharray="2 7"/><text x="75" y="540" data-right="862" font-family="DejaVu Sans" font-size="31" font-weight="normal" fill="#243947">Agua</text><text x="640" y="540" data-right="862" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#243947">900 ARS</text><path d="M75 570L825 570" stroke="#d4c7ad" stroke-width="2" stroke-dasharray="2 7"/><rect x="60" y="610" width="780" height="135" rx="14" fill="#f3e8d4" stroke="none"/><text x="85" y="652" data-right="862" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#243947">COMBO</text><text x="85" y="704" data-right="862" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#243947">Sándwich + agua</text><text x="640" y="704" data-right="862" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#243947">3.000 ARS</text><text x="75" y="825" data-right="827" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#243947">El combo no incluye postre. Consulta los ingredientes antes</text><text x="75" y="862.5" data-right="827" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#243947">de pedir si tienes alergias.</text><text x="55" y="965" data-right="862" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#687d85">Argentina</text></svg>