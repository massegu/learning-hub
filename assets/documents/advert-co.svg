<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880"><rect x="0" y="0" width="1000" height="880" rx="0" fill="#f6f3ec" stroke="none"/><rect x="22" y="22" width="956" height="836" rx="16" fill="#fff" stroke="none"/><rect x="22" y="22" width="956" height="85" rx="16" fill="#183950" stroke="none"/><text x="60" y="69" data-right="937" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#fff">CONECTA JOVEN · Bogotá · Precios en pesos colombianos (COP)</text><rect x="22" y="107" width="956" height="340" rx="0" fill="#245d72" stroke="none"/><text x="65" y="200" data-right="932" font-family="DejaVu Sans" font-size="43" font-weight="bold" fill="#fff">Titular publicitario: «¡Navega sin</text><text x="65" y="264.5" data-right="932" font-family="DejaVu Sans" font-size="43" font-weight="bold" fill="#fff">límites!»</text><text x="65" y="335" data-right="932" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#f5dca1">Plan de 30 días: 20.000 COP · Incluye 4 GB.</text><text x="65" y="525" data-right="962" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#617b89">CONDICIONES DEL PLAN</text><text x="65" y="585" data-right="932" font-family="DejaVu Sans" font-size="29" font-weight="normal" fill="#243947">Después de 4 GB se reduce la velocidad. No incluye</text><text x="65" y="628.5" data-right="932" font-family="DejaVu Sans" font-size="29" font-weight="normal" fill="#243947">llamadas. La renovación es manual.</text><text x="55" y="845" data-right="962" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#687d85">Colombia</text></svg>