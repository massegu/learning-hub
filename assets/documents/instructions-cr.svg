<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="920" viewBox="0 0 1100 920"><rect x="0" y="0" width="1100" height="920" rx="0" fill="#f6f3ec" stroke="none"/><rect x="22" y="22" width="1056" height="876" rx="16" fill="#fff" stroke="none"/><rect x="22" y="22" width="220" height="876" rx="16" fill="#e9f0f5" stroke="none"/><text x="50" y="100" data-right="1062" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#243947">RADIO</text><text x="50" y="148" data-right="1062" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#243947">ESCOLAR</text><text x="50" y="260" data-right="1062" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#243947">Mis archivos</text><text x="50" y="325" data-right="1062" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#243947">Entregas</text><text x="50" y="390" data-right="1062" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#243947">Ayuda</text><text x="280" y="100" data-right="1022" font-family="DejaVu Sans" font-size="31" font-weight="bold" fill="#243947">RADIO ESCOLAR · Heredia · Entrega de</text><text x="280" y="146.5" data-right="1022" font-family="DejaVu Sans" font-size="31" font-weight="bold" fill="#243947">una entrevista</text><rect x="280" y="213.0" width="745" height="120" rx="12" fill="#f1f6f8" stroke="none"/><text x="305" y="251.0" data-right="1002" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#243947">1. Graba la entrevista con permiso de la persona.</text><rect x="280" y="358.0" width="745" height="120" rx="12" fill="#f1f6f8" stroke="none"/><text x="305" y="396.0" data-right="1002" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#243947">2. Escucha el audio y comprueba que se entiende.</text><rect x="280" y="503.0" width="745" height="120" rx="12" fill="#f1f6f8" stroke="none"/><text x="305" y="541.0" data-right="1002" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#243947">3. Exporta un archivo MP3 de hasta 10 MB.</text><rect x="280" y="648.0" width="745" height="120" rx="12" fill="#f1f6f8" stroke="none"/><text x="305" y="686.0" data-right="1002" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#243947">4. Envía el MP3 y guarda el comprobante. No se</text><text x="305" y="725.0" data-right="1002" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#243947">aceptan enlaces privados.</text><text x="55" y="885" data-right="1062" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#687d85">Costa Rica</text></svg>