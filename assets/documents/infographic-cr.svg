<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536"><rect width="1024" height="1536" fill="#faf7ef"/><rect x="42" y="42" width="940" height="1452" rx="24" fill="white" stroke="#3b6944" stroke-width="3"/><path d="M42 66q0-24 24-24h892q24 0 24 24v145H42Z" fill="#3b6944"/><text x="80" y="100" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="white">INFOGRAFÍA</text><text x="80" y="152" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="normal" fill="white">Costa Rica · Documento de práctica</text><text x="90" y="270" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="bold" fill="#173326">AGUA EN NUESTRA ESCUELA ·</text><text x="90" y="320" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="bold" fill="#173326">San José · Recuento de una</text><text x="90" y="370" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="bold" fill="#173326">semana</text><path d="M80 411h864" stroke="#d5ded8" stroke-width="2"/><text x="90" y="455" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="normal" fill="#173326">Se revisaron 20 grifos: 15 cerraban</text><text x="90" y="505" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="normal" fill="#173326">bien y 5 tenían fugas.</text><path d="M80 546h864" stroke="#d5ded8" stroke-width="2"/><text x="90" y="590" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="normal" fill="#173326">El equipo reparó 4 de los 5 grifos con</text><text x="90" y="640" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="normal" fill="#173326">fugas. Queda uno pendiente.</text><path d="M80 681h864" stroke="#d5ded8" stroke-width="2"/><text x="90" y="725" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="normal" fill="#173326">Los datos describen esta escuela</text><text x="90" y="775" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="normal" fill="#173326">durante esa semana. No representan</text><text x="90" y="825" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="normal" fill="#173326">a todas las escuelas.</text><path d="M80 866h864" stroke="#d5ded8" stroke-width="2"/><text x="90" y="910" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="normal" fill="#173326">Documento ficticio para practicar.</text><rect x="260" y="1050" width="540" height="28" fill="#3b6944"/><text x="90" y="1075" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#173326">Sin fugas</text><text x="820" y="1075" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="normal" fill="#173326">15</text><rect x="260" y="1110" width="180" height="28" fill="#3b6944"/><text x="90" y="1135" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#173326">Con fugas</text><text x="460" y="1135" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="normal" fill="#173326">5</text><rect x="260" y="1170" width="144" height="28" fill="#3b6944"/><text x="90" y="1195" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#173326">Reparados</text><text x="424" y="1195" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="normal" fill="#173326">4</text><text x="80" y="1450" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#3b6944">LEARNING LAB · Material original ficticio</text></svg>