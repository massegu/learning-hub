<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="920" viewBox="0 0 1100 920"><rect x="0" y="0" width="1100" height="920" rx="0" fill="#f6f3ec" stroke="none"/><rect x="22" y="22" width="1056" height="876" rx="16" fill="#fff" stroke="none"/><text x="65" y="85" data-right="1027" font-family="DejaVu Sans" font-size="33" font-weight="bold" fill="#243947">AGUA EN NUESTRA ESCUELA · San José · Recuento</text><text x="65" y="134.5" data-right="1027" font-family="DejaVu Sans" font-size="33" font-weight="bold" fill="#243947">de una semana</text><text x="65" y="214.0" data-right="1027" font-family="DejaVu Sans" font-size="28" font-weight="normal" fill="#243947">Se revisaron 20 grifos: 15 cerraban bien y 5 tenían fugas.</text><rect x="65" y="276.0" width="38" height="55" rx="5" fill="#6f9a86" stroke="none"/><rect x="112" y="276.0" width="38" height="55" rx="5" fill="#6f9a86" stroke="none"/><rect x="159" y="276.0" width="38" height="55" rx="5" fill="#6f9a86" stroke="none"/><rect x="206" y="276.0" width="38" height="55" rx="5" fill="#6f9a86" stroke="none"/><rect x="253" y="276.0" width="38" height="55" rx="5" fill="#6f9a86" stroke="none"/><rect x="300" y="276.0" width="38" height="55" rx="5" fill="#6f9a86" stroke="none"/><rect x="347" y="276.0" width="38" height="55" rx="5" fill="#6f9a86" stroke="none"/><rect x="394" y="276.0" width="38" height="55" rx="5" fill="#6f9a86" stroke="none"/><rect x="441" y="276.0" width="38" height="55" rx="5" fill="#6f9a86" stroke="none"/><rect x="488" y="276.0" width="38" height="55" rx="5" fill="#6f9a86" stroke="none"/><rect x="535" y="276.0" width="38" height="55" rx="5" fill="#6f9a86" stroke="none"/><rect x="582" y="276.0" width="38" height="55" rx="5" fill="#6f9a86" stroke="none"/><rect x="629" y="276.0" width="38" height="55" rx="5" fill="#6f9a86" stroke="none"/><rect x="676" y="276.0" width="38" height="55" rx="5" fill="#6f9a86" stroke="none"/><rect x="723" y="276.0" width="38" height="55" rx="5" fill="#6f9a86" stroke="none"/><rect x="770" y="276.0" width="38" height="55" rx="5" fill="#d8984f" stroke="none"/><rect x="817" y="276.0" width="38" height="55" rx="5" fill="#d8984f" stroke="none"/><rect x="864" y="276.0" width="38" height="55" rx="5" fill="#d8984f" stroke="none"/><rect x="911" y="276.0" width="38" height="55" rx="5" fill="#d8984f" stroke="none"/><rect x="958" y="276.0" width="38" height="55" rx="5" fill="#d8984f" stroke="none"/><text x="65" y="381.0" data-right="1062" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#243947">15 sin fugas</text><text x="680" y="381.0" data-right="1062" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#243947">5 con fugas</text><text x="65" y="471.0" data-right="1027" font-family="DejaVu Sans" font-size="28" font-weight="normal" fill="#243947">El equipo reparó 4 de los 5 grifos con fugas. Queda uno pendiente.</text><rect x="65" y="533.0" width="105" height="55" rx="5" fill="#6299af" stroke="none"/><rect x="190" y="533.0" width="105" height="55" rx="5" fill="#6299af" stroke="none"/><rect x="315" y="533.0" width="105" height="55" rx="5" fill="#6299af" stroke="none"/><rect x="440" y="533.0" width="105" height="55" rx="5" fill="#6299af" stroke="none"/><rect x="565" y="533.0" width="105" height="55" rx="5" fill="#d8984f" stroke="none"/><text x="65" y="638.0" data-right="1062" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#243947">4 reparados · 1 pendiente</text><text x="65" y="733.0" data-right="1027" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#243947">Los datos describen esta escuela durante esa semana. No representan a todas</text><text x="65" y="769.0" data-right="1027" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#243947">las escuelas.</text><text x="55" y="885" data-right="1062" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#687d85">Costa Rica</text></svg>