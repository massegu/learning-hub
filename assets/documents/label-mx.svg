<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1060" viewBox="0 0 850 1060"><rect x="0" y="0" width="850" height="1060" rx="0" fill="#f6f3ec" stroke="none"/><rect x="22" y="22" width="806" height="1016" rx="16" fill="#fff" stroke="none"/><rect x="22" y="22" width="806" height="1016" rx="24" fill="#e6e9d7" stroke="none"/><rect x="55" y="55" width="740" height="950" rx="24" fill="#fffdf2" stroke="none"/><path d="M565 230c-80 80-90 155-75 230m-6-90 80-40m-73-4-45-65m51 14 60-50" fill="none" stroke="#98a278" stroke-width="14"/><text x="90" y="150" data-right="742" font-family="DejaVu Sans" font-size="43" font-weight="bold" fill="#5b6543">BEBIDA DE AVENA ·</text><text x="90" y="214.5" data-right="742" font-family="DejaVu Sans" font-size="43" font-weight="bold" fill="#5b6543">Guadalajara</text><text x="90" y="475" data-right="742" font-family="DejaVu Sans" font-size="29" font-weight="normal" fill="#243947">Contenido: 250 ml · Ingredientes: agua,</text><text x="90" y="518.5" data-right="742" font-family="DejaVu Sans" font-size="29" font-weight="normal" fill="#243947">avena y cacao.</text><path d="M90 577.0L760 577.0" stroke="#aaa98a" stroke-width="2" stroke-dasharray=""/><text x="90" y="637.0" data-right="742" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#243947">Contiene avena. Puede contener trazas</text><text x="90" y="679.0" data-right="742" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#243947">de leche.</text><text x="90" y="781.0" data-right="742" font-family="DejaVu Sans" font-size="27" font-weight="normal" fill="#243947">Agitar antes de abrir. Una vez abierta,</text><text x="90" y="821.5" data-right="742" font-family="DejaVu Sans" font-size="27" font-weight="normal" fill="#243947">conservar refrigerada y consumir en 24 horas.</text><text x="55" y="1025" data-right="812" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#687d85">México</text></svg>