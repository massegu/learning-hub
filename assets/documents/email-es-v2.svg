<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860"><rect x="0" y="0" width="1200" height="860" rx="0" fill="#e7edf4" stroke="none"/><rect x="18" y="18" width="1164" height="824" rx="18" fill="#fff" stroke="none"/><rect x="18" y="18" width="1164" height="62" rx="16" fill="#23354d" stroke="none"/><circle cx="48" cy="49" r="7" fill="#f28c8c"/><circle cx="74" cy="49" r="7" fill="#f6ce7c"/><circle cx="100" cy="49" r="7" fill="#91c9aa"/><text x="160" y="57" data-right="1176" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#fff">Correo · Grupo de ciencias</text><rect x="18" y="80" width="220" height="762" rx="0" fill="#f2f5fa" stroke="none"/><text x="43" y="128" data-right="230" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#305b86">CORREO</text><rect x="30" y="160" width="196" height="48" rx="9" fill="#dbe9fa" stroke="none"/><text x="43" y="190" data-right="230" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#305b86">Bandeja de entrada</text><text x="43" y="252" data-right="230" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#305b86">Enviados</text><text x="43" y="314" data-right="230" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#305b86">Borradores</text><text x="43" y="376" data-right="230" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#305b86">Archivos</text><text x="270" y="130" data-right="1176" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#203247">Cambio de punto de encuentro</text><text x="270" y="177" data-right="1176" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#203247">Aula de ciencias &lt;aula@colegio.example&gt;</text><text x="270" y="214" data-right="1176" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#64748b">Para: Grupo de ciencias · 22/10/2026, 16:10</text><path d="M270 240H1140" stroke="#cbd5e1" stroke-width="2"/><text x="270" y="290" data-right="1122" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#203247">La salida al museo es el sábado 24 de octubre. Nos reunimos a las</text><text x="270" y="329" data-right="1122" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#203247">09:15 en la entrada norte, en lugar de la puerta principal. El</text><text x="270" y="368" data-right="1122" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#203247">autobús sale a las 09:30. La hora de regreso sigue siendo las</text><text x="270" y="407" data-right="1122" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#203247">13:00.</text><text x="270" y="466" data-right="1122" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#203247">Trae una botella de agua y la autorización firmada. Confirma tu</text><text x="270" y="505" data-right="1122" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#203247">asistencia respondiendo a este mensaje antes del viernes 23 a las</text><text x="270" y="544" data-right="1122" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#203247">18:00.</text><rect x="270" y="593" width="360" height="64" rx="10" fill="#eff5fa" stroke="#cbd8e4"/><text x="292" y="633" data-right="1176" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#203247">Archivo: autorizacion.pdf</text><text x="270" y="698" data-right="1122" font-family="DejaVu Sans" font-size="21" font-weight="normal" fill="#203247">Un borrador guardado no cuenta como respuesta enviada.</text><rect x="270" y="747" width="190" height="52" rx="10" fill="#2865a0" stroke="none"/><text x="295" y="781" data-right="1176" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#fff">Responder</text></svg>