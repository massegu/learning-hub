# CI only. Cloudflare Pages deploys production from main and previews from other branches.
# No database migrations, Edge Function deployments, branch pushes or URL polling here.
name: Comprobar Learning Hub
on:
  push:
    branches: [main, desarrollo]
  pull_request:
    branches: [main, desarrollo]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learning-hub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser-billing.py
      - run: python tests/browser-auth-account.py
      - run: python tests/browser-session-layout.py
      - run: python tests/browser-supervision.py
      - run: python tests/browser-practice-documents-memory.py
      - run: python tests/browser-varied-mechanics.py
      - run: python tests/browser-presentation.py
      - run: python tests/browser-photo-scenes.py
      - run: python tests/browser-memory-layout.py
      - run: python tests/browser-processing-speed.py
      - run: python tests/browser-interactive-activities.py
      - run: python tests/browser-listening-social.py
      - run: python tests/browser-privacy.py
      - run: python tests/browser-age-designs.py
      - run: python tests/browser-content-quality.py
      - run: python tests/browser-executed-tasks.py
      - run: python tests/browser-cognitive-families.py
